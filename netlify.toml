[build]
  command = "npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID,TCT_BOOTSTRAP_USERNAME,TCT_CORS_ORIGINS,TCT_SECURE_COOKIE,TCT_SESSION_MAX_AGE,VITE_API_BASE_URL,VITE_API_TIMEOUT_MS"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**,frontend/node_modules/**"

[functions]
  included_files = ["backend/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200