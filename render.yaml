services:
  - type: web
    name: tct-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TCT_SESSION_SECRET
        sync: false
      - key: TCT_BOOTSTRAP_USERNAME
        sync: false
      - key: TCT_BOOTSTRAP_PASSWORD_HASH
        sync: false
      - key: TCT_SESSION_MAX_AGE
        value: "28800"
      - key: TCT_SECURE_COOKIE
        value: "true"
      - key: TCT_COOKIE_SAMESITE
        value: "none"
      - key: TCT_CORS_ORIGINS
        sync: false

  - type: web
    name: tct-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_TIMEOUT_MS
        value: "10000"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
